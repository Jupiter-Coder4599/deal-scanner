name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Expo
        run: npm install
      - name: Install libraries matched to this Expo SDK
        run: |
          LIBS="react-native-webview react-native-safe-area-context @react-native-async-storage/async-storage expo-status-bar"
          npx expo install $LIBS || npx expo install $LIBS
      - name: Check project health
        run: npx expo-doctor || true
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Markdown-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
