name: Unzip upload

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip into the repo
        run: |
          mkdir -p /tmp/unz
          for z in *.zip; do unzip -o "$z" -d /tmp/unz; done
          dirs=$(find /tmp/unz -mindepth 1 -maxdepth 1 -type d | wc -l)
          files=$(find /tmp/unz -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$dirs" = "1" ] && [ "$files" = "0" ]; then src=$(find /tmp/unz -mindepth 1 -maxdepth 1 -type d); else src=/tmp/unz; fi
          rsync -a --exclude='.github' "$src"/ ./
          git rm -q *.zip
          git config user.name "unzip-bot"
          git config user.email "unzip-bot@users.noreply.github.com"
          git add -A
          git commit -m "Unzip upload"
          git push
