name: Scan for deals

on:
  schedule:
    - cron: "0 11,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Target (all Harris County stores)
        continue-on-error: true
        env:
          MAX_PRICE: ${{ vars.MAX_PRICE }}
          MIN_PCT_OFF: ${{ vars.MIN_PCT_OFF }}
        run: node scan-target.js
      - name: Merge results
        run: node merge.js
      - name: Save results
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add deals.json deals.md *-deals.json
          git diff --cached --quiet || git commit -m "Update deals"
          git push
